<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RSS Reader</title>
  <meta name="theme-color" content="#f4f4f5">

  <!-- Theme bootstrap (runs before the first paint): the resolved OS or
       platform-frame colour scheme is the default, and a mode the user
       picked in-app ("light" / "dark") is persisted over it. The theme
       token and the bridge's setAppearance call below keep the platform
       bar and cold-launch screen in sync with this page. -->
  <script>
    (function () {
      try {
        var KEY = 'rss-theme-mode';
        var mode = localStorage.getItem(KEY);
        var dark = mode === 'dark' || (mode !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (_) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%270.9em%27%20font-size%3D%2790%27%3E%F0%9F%93%B0%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="manifest" href="/manifest.webmanifest">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level] : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>

  <!-- Tailwind is precompiled for this app: npm run build generates
       /tailwind.css from this markup on every image build. Class names
       below are written as whole literals so the extractor sees them. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- Centrally hosted platform files, by relative path. The bridge is how
       the app answers the shell; the native kit gives the mobile-native feel. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* App palette, driven by the html.dark class (platform-native kit
       convention: tokens on :root / .dark, never forked kit CSS). */
    :root {
      --ab-body: #3f3f46;
      --ab-heading: #18181b;
      --ab-accent: #7c3aed;
      --ab-quote: #52525b;
      --ab-quote-border: #e4e4e7;
      --ab-pre-bg: #f4f4f5;
      --seg-active-bg: #e4e4e7;
      --seg-active-fg: #18181b;
      --seg-inactive-fg: #71717a;
    }
    .dark {
      --ab-body: #d4d4d8;
      --ab-heading: #fafafa;
      --ab-accent: #8b5cf6;
      --ab-quote: #a1a1aa;
      --ab-quote-border: #3f3f46;
      --ab-pre-bg: #18181b;
      --seg-active-bg: #27272a;
      --seg-active-fg: #fafafa;
      --seg-inactive-fg: #a1a1aa;
    }
    .article-body { font-size: 1rem; line-height: 1.7; color: var(--ab-body); overflow-wrap: break-word; }
    .article-body p { margin: 0 0 1em; }
    .article-body img { max-width: 100%; height: auto; border-radius: 0.75rem; margin: 0.5em 0; }
    .article-body h1, .article-body h2, .article-body h3 { color: var(--ab-heading); line-height: 1.3; margin: 1.2em 0 0.5em; font-size: 1.1rem; }
    .article-body a { color: var(--ab-accent); }
    .article-body blockquote { border-left: 3px solid var(--ab-quote-border); padding-left: 0.9em; color: var(--ab-quote); margin: 1em 0; }
    .article-body ul, .article-body ol { padding-left: 1.4em; margin: 0 0 1em; }
    .article-body pre { background: var(--ab-pre-bg); border-radius: 0.5rem; padding: 0.8em; overflow-x: auto; font-size: 0.85em; }
    .seg-active { background: var(--seg-active-bg); color: var(--seg-active-fg); }
    .seg-inactive { background: transparent; color: var(--seg-inactive-fg); }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">

  <!-- Article view, pushed over the list -->
  <div id="article-view" class="fixed inset-0 bg-zinc-50 dark:bg-zinc-950 flex-col" style="display:none;z-index:200">
    <div class="un-navbar un-safe-top flex items-center gap-2 px-2">
      <button id="article-back" class="un-navbar-back un-touch-target" aria-label="Back"></button>
      <div class="un-navbar-title text-base font-semibold truncate"></div>
      <a id="article-open-link" href="#" target="_blank" rel="noopener"
         class="ml-auto shrink-0 inline-flex items-center gap-1.5 text-[13px] font-medium px-3 py-1.5 rounded-full bg-violet-600/10 text-violet-700 dark:bg-violet-600/20 dark:text-violet-300">
        Open in browser
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
      </a>
    </div>
    <div id="article-scroll" class="flex-1 overflow-y-auto overscroll-contain">
      <div class="max-w-2xl mx-auto px-4 pt-5 pb-24">
        <div class="flex items-center gap-2 text-xs text-zinc-500 mb-2">
          <span id="article-feed-dot" class="w-2 h-2 rounded-full shrink-0"></span>
          <span id="article-feed-name" class="truncate"></span>
        </div>
        <h1 id="article-title" class="text-2xl font-bold leading-snug text-zinc-900 dark:text-zinc-50 mb-2"></h1>
        <p id="article-meta" class="text-xs text-zinc-500 mb-5"></p>
        <div id="article-body" class="article-body"></div>
        <a id="article-open-link-2" href="#" target="_blank" rel="noopener"
           class="mt-6 inline-flex items-center gap-2 px-4 py-2.5 rounded-full bg-violet-600 text-white text-sm font-semibold">
          Open original in browser
        </a>
      </div>
    </div>
  </div>

  <!-- Main list screen -->
  <main id="main-view" class="h-full flex flex-col">
    <div class="un-navbar un-safe-top" style="padding-left:0.5rem;padding-right:0.5rem;">
      <div class="w-full">
        <div class="flex items-center w-full gap-1">
          <button id="feeds-btn" class="un-touch-target w-11 h-11 flex items-center justify-center text-violet-600 dark:text-violet-400" aria-label="Feeds">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
          </button>
          <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 min-w-0 max-w-full">
            <button id="filter-dropdown-btn" class="seg-active flex items-center gap-1 px-3 py-1 rounded-full text-[15px] font-semibold" aria-label="Filter items" aria-haspopup="menu">
              <span id="filter-dropdown-label">Unread</span>
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <span id="unread-badge" class="shrink-0 text-xs font-semibold px-2 py-0.5 rounded-full bg-violet-600/10 text-violet-700 dark:bg-violet-600/20 dark:text-violet-300">0</span>
          </div>
          <button id="header-menu-btn" class="ml-auto un-touch-target w-11 h-11 flex items-center justify-center text-violet-600 dark:text-violet-400" aria-label="More actions" aria-haspopup="menu">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="list-scroll" class="flex-1 overflow-y-auto overscroll-contain pt-[64px]">
      <div id="empty-state" class="hidden flex-col items-center justify-center text-center px-8 pt-24 gap-3">
        <svg class="w-12 h-12 text-zinc-300 dark:text-zinc-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
        <p id="empty-title" class="text-zinc-600 dark:text-zinc-300 font-medium">You're all caught up</p>
        <p id="empty-hint" class="text-sm text-zinc-500">Tap + to add a feed, then new items show up here.</p>
      </div>
      <div id="item-list" class="un-group mx-3 mb-3 overflow-hidden"></div>
    </div>
  </main>

  <!-- Feeds screen, pushed over the list -->
  <div id="feeds-view" class="fixed inset-0 bg-zinc-50 dark:bg-zinc-950 flex-col" style="display:none;z-index:200">
    <div class="un-navbar un-safe-top flex items-center gap-2 px-2">
      <button id="feeds-back" class="un-navbar-back un-touch-target" aria-label="Back"></button>
      <div class="un-navbar-title text-base font-semibold">Your feeds</div>
      <span class="w-11 shrink-0" aria-hidden="true"></span>
      <button id="feeds-refresh-all" class="un-touch-target w-11 h-11 flex items-center justify-center text-violet-600 dark:text-violet-400" aria-label="Refresh all feeds">
        <svg id="feeds-refresh-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <div id="feeds-scroll" class="flex-1 overflow-y-auto overscroll-contain pt-16">
      <div class="max-w-2xl mx-auto px-4 pt-4 pb-28">
        <div id="feed-list" class="un-group overflow-hidden"></div>
        <button id="feeds-add-btn" class="mt-4 w-full py-3 rounded-xl bg-violet-600 text-white font-semibold active:scale-[0.98]">Add a feed</button>
        <p class="mt-3 text-xs text-zinc-500 dark:text-zinc-600 text-center">Feeds refresh when you add them and from this screen. Swipe a row left to remove it.</p>
      </div>
    </div>
  </div>

  <!-- Add-feed sheet content (moved into the kit's sheet when presented) -->
  <div id="add-sheet-content" class="hidden px-4 pb-2 pt-1">
    <h2 class="text-lg font-semibold mb-1">Add a feed</h2>
    <p class="text-sm text-zinc-500 mb-3">Paste the RSS or Atom URL.</p>
    <input id="add-feed-input" type="url" inputmode="url" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="https://example.com/feed.xml"
           class="w-full px-3.5 py-3 rounded-xl bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 text-[15px] outline-none ring-1 ring-zinc-300 dark:ring-zinc-800 focus:ring-violet-500">
    <p id="add-feed-error" class="text-sm text-red-600 dark:text-red-400 mt-2 min-h-[1.25rem]"></p>
    <button id="add-feed-submit" class="mt-1 w-full py-3 rounded-xl bg-violet-600 text-white font-semibold active:scale-[0.98] disabled:opacity-50 disabled:active:scale-100">Add feed</button>
  </div>

  <script>
    'use strict';

    // The shell injects ?token= on load. Offline loads carry no token, so the
    // last known one is kept in localStorage and reused. It only verifies
    // identity; it is never destroyed here.
    const TOKEN_KEY = 'rss-reader-token';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || localStorage.getItem(TOKEN_KEY) || '';
    if (params.get('token')) { try { localStorage.setItem(TOKEN_KEY, token); } catch (_) {} }
    const authHeaders = token ? { 'x-usernode-token': token } : {};

    async function api(path, opts) {
      opts = opts || {};
      const res = await fetch(path, {
        method: opts.method || 'GET',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders, opts.headers || {}),
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
      return data;
    }

    let items = [];
    let unreadTotal = 0;
    let filter = localStorage.getItem('rss-filter') === 'all' ? 'all' : 'unread';
    let openItemId = null;
    let swipeHandles = [];

    const $ = (id) => document.getElementById(id);
    const listScroll = $('list-scroll');
    const unNative = window.unNative || {};

    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const diff = Date.now() - d.getTime();
      const min = Math.floor(diff / 60000);
      if (min < 1) return 'now';
      if (min < 60) return min + 'm';
      const h = Math.floor(min / 60);
      if (h < 24) return h + 'h';
      const days = Math.floor(h / 24);
      if (days < 7) return days + 'd';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
    }

    function setFilter(next) {
      // One flat stream: Unread shows only unread items, All shows
      // everything. The dropdown choice is remembered across visits.
      filter = next;
      try { localStorage.setItem('rss-filter', next); } catch (_) {}
      $('filter-dropdown-label').textContent = filter === 'unread' ? 'Unread' : 'All';
      renderList();
    }

    function detachSwipes() {
      swipeHandles.forEach(function (h) { try { h.detach(); } catch (_) {} });
      swipeHandles = [];
    }

    function renderList() {
      const listEl = $('item-list');
      detachSwipes();
      const unread = items.filter(function (it) { return !it.read; });
      const read = items.filter(function (it) { return it.read; });
      // In the All view everything is one list; in Unread only unread items show.
      const shown = filter === 'all' ? items : unread;
      const caughtUp = filter === 'unread' && unread.length === 0 && read.length > 0;
      const isEmpty = !shown.length && !caughtUp;
      $('unread-badge').textContent = String(unreadTotal || 0);
      $('unread-badge').classList.toggle('hidden', !(unreadTotal > 0));
      $('empty-state').className = isEmpty ? 'flex flex-col items-center justify-center text-center px-8 pt-24 gap-3' : 'hidden';
      if (isEmpty) {
        $('empty-title').textContent = caughtUp ? "You're all caught up" : 'No items yet';
        $('empty-hint').textContent = caughtUp
          ? 'New articles land here as your feeds update.'
          : 'Add a feed and its items will appear here.';
        listEl.innerHTML = '';
        return;
      }
      listEl.innerHTML = shown.map(function (it) {
        var readCls = it.read ? ' opacity-50' : '';
        return (
          '<div class="un-swipe"><div class="un-group-row' + readCls + ' flex items-start gap-3 px-4 py-3 cursor-pointer" data-id="' + it.id + '" role="button" tabindex="0">' +
            (it.thumb_url
              ? '<img src="' + esc(it.thumb_url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" class="w-14 h-14 rounded-xl object-cover shrink-0" onerror="this.style.display=\'none\'">'
              : '<span class="item-thumb-fallback mt-1.5 w-2 h-2 rounded-full shrink-0" style="background:' + esc(it.feed_color || '#7c3aed') + '"></span>') +
            '<div class="min-w-0 flex-1">' +
              '<p class="text-[15px] font-semibold leading-snug text-zinc-900 dark:text-zinc-100 line-clamp-2">' + esc(it.title) + '</p>' +
              '<p class="mt-1 text-xs text-zinc-500 truncate">' + esc(it.feed_title) + '</p>' +
            '</div>' +
            '<span class="text-[11px] text-zinc-500 dark:text-zinc-600 shrink-0 mt-1">' + fmtTime(it.published) + '</span>' +
          '</div></div>'
        );
      }).join('');

      Array.prototype.forEach.call(listEl.querySelectorAll('.un-swipe'), function (rowEl) {
        var id = parseInt(rowEl.querySelector('[data-id]').getAttribute('data-id'), 10);
        var it = shown.find(function (x) { return x.id === id; });
        var h = unNative.attachSwipeActions(rowEl, {
          actions: [{
            label: it && it.read ? 'Unread' : 'Read',
            handler: function () { toggleRead(it, !(it && it.read)); },
          }],
        });
        swipeHandles.push(h);
      });

      Array.prototype.forEach.call(listEl.querySelectorAll('[data-id]'), function (rowEl) {
        rowEl.addEventListener('click', function () {
          var id = parseInt(rowEl.getAttribute('data-id'), 10);
          openArticle(shown.find(function (x) { return x.id === id; }));
        });
      });
    }

    async function toggleRead(it, read) {
      if (!it) return;
      try {
        await api('/api/items/' + it.id + (read ? '/read' : '/unread'), { method: 'POST' });
        it.read = read;
        unreadTotal = Math.max(0, unreadTotal + (read ? -1 : 1));
        renderList();
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
    }

    async function toggleBookmark(it) {
      if (!it) return;
      try {
        const r = await api('/api/items/' + it.id + '/bookmark', { method: 'POST' });
        it.bookmarked = r.bookmarked;
        if (unNative.toast) unNative.toast(r.bookmarked ? 'Saved for later' : 'Removed from saved');
        renderList();
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
    }

    function openArticle(it) {
      if (!it) return;
      openItemId = it.id;
      $('article-feed-dot').style.background = it.feed_color || '#7c3aed';
      $('article-feed-name').textContent = it.feed_title || '';
      $('article-title').textContent = it.title || 'Untitled';
      var meta = [];
      if (it.author) meta.push(it.author);
      if (it.published) meta.push(new Date(it.published).toLocaleString());
      $('article-meta').textContent = meta.join(' · ');
      $('article-body').innerHTML = it.summary || '<p class="text-zinc-500">No preview available for this item.</p>';
      $('article-open-link').href = it.link;
      $('article-open-link-2').href = it.link;
      $('article-scroll').scrollTop = 0;
      if (!it.read) toggleRead(it, true);
      const show = function () {
        $('article-view').style.display = 'flex';
      };
      if (unNative.transition) {
        unNative.transition(show, { type: 'push' });
      } else {
        show();
      }
    }

    function closeArticle() {
      const hide = function () {
        $('article-view').style.display = 'none';
      };
      if (unNative.transition) {
        unNative.transition(hide, { type: 'pop' });
      } else {
        hide();
      }
      openItemId = null;
      renderList();
    }

    async function openFeeds() {
      const show = function () {
        $('feeds-view').style.display = 'flex';
      };
      if (unNative.transition) {
        unNative.transition(show, { type: 'push' });
      } else {
        show();
      }
      await loadFeeds();
    }

    function closeFeeds() {
      const hide = function () {
        $('feeds-view').style.display = 'none';
      };
      if (unNative.transition) {
        unNative.transition(hide, { type: 'pop' });
      } else {
        hide();
      }
    }

    let feedHandles = [];
    function detachFeedSwipes() {
      feedHandles.forEach(function (h) { try { h.detach(); } catch (_) {} });
      feedHandles = [];
    }

    async function loadFeeds() {
      try {
        const data = await api('/api/feeds');
        const listEl = $('feed-list');
        detachFeedSwipes();
        if (!data.feeds.length) {
          listEl.innerHTML = '<div class="px-4 py-6 text-center text-sm text-zinc-500">No feeds yet. Add your first one below.</div>';
          return;
        }
        listEl.innerHTML = data.feeds.map(function (f) {
          var errBadge = f.status === 'error'
            ? '<span class="text-[10px] uppercase tracking-wide text-amber-500 bg-amber-500/10 px-1.5 py-0.5 rounded">error</span>' : '';
          return (
            '<div class="un-swipe"><div class="un-group-row flex items-center gap-3 px-4 py-3">' +
              '<span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:' + esc(f.color) + '"></span>' +
              '<div class="min-w-0 flex-1">' +
                '<p class="text-[15px] font-medium truncate">' + esc(f.title) + '</p>' +
                '<p class="text-xs text-zinc-500 truncate">' + esc(f.url) + '</p>' +
              '</div>' +
              errBadge +
              '<span class="text-xs text-zinc-500 shrink-0">' + f.unread + '</span>' +
            '</div></div>'
          );
        }).join('');
        Array.prototype.forEach.call(listEl.querySelectorAll('.un-swipe'), function (rowEl, idx) {
          var feed = data.feeds[idx];
          var h = unNative.attachSwipeActions(rowEl, {
            actions: [
              { label: 'Remove', destructive: true, handler: function () { removeFeed(feed); } },
            ],
          });
          feedHandles.push(h);
        });
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
    }

    async function removeFeed(feed) {
      try {
        await api('/api/feeds/' + feed.id, { method: 'DELETE' });
        if (unNative.toast) unNative.toast('Feed removed');
        await loadFeeds();
        await loadItems();
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
    }

    async function refreshAllFeeds() {
      const icon = $('feeds-refresh-icon');
      icon.classList.add('animate-spin');
      try {
        const data = await api('/api/feeds');
        for (const f of data.feeds) {
          await api('/api/feeds/' + f.id + '/refresh', { method: 'POST' });
        }
        await loadFeeds();
        await loadItems();
        if (unNative.toast) unNative.toast('Feeds refreshed');
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
      icon.classList.remove('animate-spin');
    }

    async function refreshAll() {
      const icons = document.querySelectorAll('#main-refresh-btn svg, #feeds-refresh-icon');
      icons.forEach(function (i) { i.classList.add('animate-spin'); });
      try {
        const data = await api('/api/feeds');
        for (const f of data.feeds) {
          await api('/api/feeds/' + f.id + '/refresh', { method: 'POST' });
        }
        await loadItems();
        await loadFeeds();
        if (unNative.toast) unNative.toast('Feeds refreshed');
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
      icons.forEach(function (i) { i.classList.remove('animate-spin'); });
    }

    async function markAllRead() {
      try {
        await api('/api/read-all', { method: 'POST' });
        if (unNative.toast) unNative.toast('All articles marked as read');
        await loadItems();
      } catch (err) { if (unNative.toast) unNative.toast(err.message); }
    }

    function presentAddSheet() {
      $('add-feed-input').value = '';
      $('add-feed-error').textContent = '';
      const contentEl = $('add-sheet-content');
      contentEl.classList.remove('hidden');
      let sheet = null;
      if (unNative.presentSheet) {
        sheet = unNative.presentSheet({
          contentEl: contentEl,
          onDismiss: function () { contentEl.classList.add('hidden'); },
        });
      }
      $('add-feed-submit').onclick = async function () {
        const url = $('add-feed-input').value.trim();
        if (!url) { $('add-feed-error').textContent = 'Paste a feed URL first.'; return; }
        $('add-feed-submit').disabled = true;
        $('add-feed-error').textContent = '';
        try {
          const r = await api('/api/feeds', { method: 'POST', body: { url: url } });
          if (sheet) sheet.dismiss();
          if (unNative.toast) unNative.toast(r.warning ? 'Feed saved, but it could not be read' : 'Feed added');
          await loadItems();
        } catch (err) {
          $('add-feed-error').textContent = err.message;
        }
        $('add-feed-submit').disabled = false;
      };
      setTimeout(function () { $('add-feed-input').focus({ preventScroll: true }); }, 350);
    }

    function presentHeaderMenu() {
      if (unNative.menu) {
        unNative.menu({
          anchorEl: $('header-menu-btn'),
          placement: 'bottom-end',
          items: [
            { label: 'Mark all as read', handler: function () { markAllRead(); } },
            { label: 'Refresh feeds', handler: function () { refreshAll(); } },
          ],
        });
      }
    }

    async function loadItems() {
      try {
        const data = await api('/api/items?filter=all&limit=300');
        items = data.items || [];
        unreadTotal = data.unreadTotal || 0;
        renderList();
      } catch (err) {
        if (unNative.toast) unNative.toast(err.message);
      }
    }

    // ---- theme --------------------------------------------------------------
    // Follows the platform: the OS/iframe colour scheme decides the mode
    // (no in-app picker). setAppearance reports the RESOLVED scheme plus the
    // page ground so the shell can match the platform bar and the
    // cold-launch screen.
    function isDark() { return document.documentElement.classList.contains('dark'); }
    function resolvedScheme() { return isDark() ? 'dark' : 'light'; }
    function reportAppearance() {
      const bg = getComputedStyle(document.body).backgroundColor;
      const m = /^rgba?\((\d+), (\d+), (\d+)/.exec(bg);
      const hex = m ? '#' + m.slice(1).map(function (n) {
        return parseInt(n, 10).toString(16).padStart(2, '0');
      }).join('') : undefined;
      try {
        // Only meaningful inside the mobile shell; the bridge rejects the
        // call with a console error elsewhere, so gate on isNative.
        if (window.usernode && window.usernode.isNative &&
            typeof window.usernode.setAppearance === 'function') {
          window.usernode.setAppearance({ scheme: resolvedScheme(), background: hex });
        }
      } catch (_) {}
    }
    function syncThemeUI() {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', isDark() ? '#09090b' : '#f4f4f5');
    }
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        // Live-follow the OS scheme change: re-sync colorScheme, the meta
        // tag and the shell appearance. The dark class was already set by
        // the bootstrap; re-toggling from the media query result is exact.
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        syncThemeUI();
        reportAppearance();
      });
    } catch (_) {}
    syncThemeUI();
    reportAppearance();

    $('feeds-add-btn').addEventListener('click', presentAddSheet);
    $('article-back').addEventListener('click', closeArticle);
    $('feeds-btn').addEventListener('click', openFeeds);
    $('feeds-back').addEventListener('click', closeFeeds);
    $('feeds-refresh-all').addEventListener('click', refreshAllFeeds);
    $('header-menu-btn').addEventListener('click', presentHeaderMenu);
    $('filter-dropdown-btn').addEventListener('click', function () {
      if (!unNative.menu) return;
      unNative.menu({
        anchorEl: $('filter-dropdown-btn'),
        placement: 'bottom-start',
        items: [
          { label: 'All', handler: function () { setFilter('all'); } },
          { label: 'Unread', handler: function () { setFilter('unread'); } },
        ],
      });
    });

    if (unNative.attachPullToRefresh) {
      unNative.attachPullToRefresh(listScroll, async function () {
        const data = await api('/api/feeds');
        for (const f of data.feeds) {
          await api('/api/feeds/' + f.id + '/refresh', { method: 'POST' });
        }
        await loadItems();
      });
    }

    // ?demo=1 seeds a couple of fake rows for the CALLING user first, so a
    // staging preview (or a fresh reviewer account) has something to look
    // at. Staging-only on the server; a plain load never touches it.
    (async function () {
      if (params.get('demo') === '1') {
        try { await api('/api/demo-items?demo=1'); } catch (err) {}
      }
      setFilter(filter);
      loadItems();
    })();

    // Testing deep links: let a review URL open a screen directly.
    // Pure UI state only; no data is written here.
    (function () {
      var view = params.get('view');
      var demo = params.get('demo');
      if (view === 'unread') {
        setTimeout(function () { setFilter('unread'); }, 250);
      } else if (view === 'feeds') {
        setTimeout(function () { openFeeds(); }, 250);
      } else if (demo === 'article') {
        setTimeout(function () {
          openArticle({
            id: 0,
            link: 'https://example.com/staging-demo-article',
            title: 'Staging demo article',
            feed_title: 'Staging demo feed',
            feed_color: '#0ea5e9',
            published: new Date().toISOString(),
            summary: '<p>This is a seeded preview of the inline article view. It exists only when the URL has demo=article.</p>',
          });
        }, 250);
      }
    })();
  </script>
</body>
</html>
